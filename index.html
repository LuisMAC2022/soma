<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="An accessible animated CSS illustration of a colossal neuron with dendrites, soma, axon, ions, and drifting biological mist." />
  <title>Colossal Neuron</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <main id="main-content" class="scene" aria-labelledby="page-title">
    <header class="scene__intro">
      <p class="eyebrow">CSS biological study</p>
      <h1 id="page-title">Colossal Neuron</h1>
      <p class="scene__summary">A living neuron draft: pulsing soma, ocular nucleus, myelinated axon, ion exchange, and drifting extracellular particles.</p>
    </header>

    <div class="environment" aria-hidden="true">
      <div class="mist mist-1"></div>
      <div class="mist mist-2"></div>
      <div class="mist mist-3"></div>
    </div>

    <section class="neuron" aria-label="Animated illustration of a colossal neuron">
      <div class="dendrites" aria-hidden="true">
        <div class="tentacle t1"></div>
        <div class="tentacle t2"></div>
        <div class="tentacle t3"></div>
        <div class="tentacle t4"></div>
        <div class="tentacle t5"></div>
        <div class="tentacle t6"></div>
      </div>

      <div class="soma" aria-hidden="true">
        <div class="soma-shell soma-shell-outer"></div>
        <div class="soma-shell soma-shell-inner"></div>
        <div class="vascular-overlay"></div>

        <div class="eye-nucleus">
          <div class="eye-cornea"></div>
          <div class="eye-iris"></div>
          <div class="eye-pupil"></div>
          <div class="eye-gloss"></div>
        </div>
      </div>

      <div class="axon" aria-hidden="true">
        <div class="axon-core"></div>
        <div class="myelin m1"></div>
        <div class="node n1"></div>
        <div class="myelin m2"></div>
        <div class="node n2"></div>
        <div class="myelin m3"></div>
        <div class="node n3"></div>
        <div class="myelin m4"></div>
        <div class="signal"></div>
      </div>

      <div class="ions" aria-hidden="true">
        <div class="ion na na1">Na+</div>
        <div class="ion na na2">Na+</div>
        <div class="ion k k1">K+</div>
        <div class="ion k k2">K+</div>
      </div>

      <div class="fluids" aria-hidden="true">
        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
      </div>
    </section>
  </main>
</body>
</html>
