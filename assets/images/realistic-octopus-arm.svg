<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 800" width="1200" height="800">
  <title id="title">Realistic octopus arm</title>
  <desc id="desc">A curved reddish purple octopus arm with textured skin, highlights, shadows, and rows of pale suction cups.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98775"/>
      <stop offset="0.32" stop-color="#9f3f63"/>
      <stop offset="0.7" stop-color="#5e2447"/>
      <stop offset="1" stop-color="#2c1630"/>
    </linearGradient>
    <radialGradient id="cup" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff0df"/>
      <stop offset="0.5" stop-color="#d39b84"/>
      <stop offset="0.82" stop-color="#7d3f59"/>
      <stop offset="1" stop-color="#35182f"/>
    </radialGradient>
    <radialGradient id="cupInner" cx="48%" cy="50%" r="58%">
      <stop offset="0" stop-color="#6d2944"/>
      <stop offset="0.7" stop-color="#be786f"/>
      <stop offset="1" stop-color="#f5d0b8"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#120914" flood-opacity="0.55"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in2="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#111827"/>
  <ellipse cx="596" cy="660" rx="460" ry="58" fill="#050816" opacity="0.58"/>

  <g filter="url(#softShadow)">
    <path d="M1044 604 C884 652 675 617 535 504 C405 400 341 250 428 153 C503 69 670 102 735 224 C805 358 716 491 583 501 C463 510 366 455 282 378 C226 326 158 310 97 331 C57 345 31 374 31 407 C32 438 58 466 99 481 C169 506 242 490 302 452 C392 394 492 405 580 472 C706 568 870 569 1010 518 C1066 498 1105 516 1114 553 C1123 587 1094 620 1044 604 Z" fill="url(#skin)"/>
    <path d="M1031 562 C866 604 696 567 586 484 C485 408 431 291 482 205 C526 131 653 150 704 250 C764 367 687 456 576 463 C461 470 377 420 305 353 C244 297 169 277 97 301 C31 323 -4 374 10 425 C23 475 69 513 134 525 C210 539 280 519 340 480 C409 435 481 443 559 500 C686 594 872 605 1027 552 Z" fill="#f0a184" opacity="0.18"/>
    <path d="M1044 604 C884 652 675 617 535 504 C405 400 341 250 428 153 C503 69 670 102 735 224" fill="none" stroke="#ffd0b3" stroke-width="18" stroke-linecap="round" opacity="0.16"/>
    <path d="M109 428 C188 451 255 433 321 391 C407 336 508 364 587 430 C691 518 845 540 1021 494" fill="none" stroke="#1d1022" stroke-width="38" stroke-linecap="round" opacity="0.28"/>
  </g>

  <g opacity="0.9">
    <circle cx="133" cy="407" r="32" fill="url(#cup)"/><circle cx="133" cy="407" r="15" fill="url(#cupInner)"/>
    <circle cx="207" cy="405" r="35" fill="url(#cup)"/><circle cx="207" cy="405" r="16" fill="url(#cupInner)"/>
    <circle cx="288" cy="374" r="39" fill="url(#cup)"/><circle cx="288" cy="374" r="18" fill="url(#cupInner)"/>
    <circle cx="384" cy="358" r="42" fill="url(#cup)"/><circle cx="384" cy="358" r="20" fill="url(#cupInner)"/>
    <circle cx="481" cy="388" r="44" fill="url(#cup)"/><circle cx="481" cy="388" r="21" fill="url(#cupInner)"/>
    <circle cx="571" cy="448" r="43" fill="url(#cup)"/><circle cx="571" cy="448" r="20" fill="url(#cupInner)"/>
    <circle cx="668" cy="501" r="40" fill="url(#cup)"/><circle cx="668" cy="501" r="19" fill="url(#cupInner)"/>
    <circle cx="777" cy="529" r="36" fill="url(#cup)"/><circle cx="777" cy="529" r="17" fill="url(#cupInner)"/>
    <circle cx="895" cy="528" r="31" fill="url(#cup)"/><circle cx="895" cy="528" r="14" fill="url(#cupInner)"/>
    <circle cx="1003" cy="507" r="25" fill="url(#cup)"/><circle cx="1003" cy="507" r="11" fill="url(#cupInner)"/>
  </g>

  <g opacity="0.72">
    <circle cx="160" cy="458" r="22" fill="url(#cup)"/><circle cx="160" cy="458" r="10" fill="url(#cupInner)"/>
    <circle cx="247" cy="441" r="26" fill="url(#cup)"/><circle cx="247" cy="441" r="12" fill="url(#cupInner)"/>
    <circle cx="354" cy="410" r="30" fill="url(#cup)"/><circle cx="354" cy="410" r="14" fill="url(#cupInner)"/>
    <circle cx="456" cy="432" r="32" fill="url(#cup)"/><circle cx="456" cy="432" r="15" fill="url(#cupInner)"/>
    <circle cx="550" cy="492" r="31" fill="url(#cup)"/><circle cx="550" cy="492" r="14" fill="url(#cupInner)"/>
    <circle cx="648" cy="543" r="29" fill="url(#cup)"/><circle cx="648" cy="543" r="13" fill="url(#cupInner)"/>
    <circle cx="759" cy="570" r="25" fill="url(#cup)"/><circle cx="759" cy="570" r="12" fill="url(#cupInner)"/>
    <circle cx="884" cy="571" r="21" fill="url(#cup)"/><circle cx="884" cy="571" r="10" fill="url(#cupInner)"/>
  </g>

  <g filter="url(#grain)" opacity="0.8">
    <path d="M1044 604 C884 652 675 617 535 504 C405 400 341 250 428 153 C503 69 670 102 735 224 C805 358 716 491 583 501 C463 510 366 455 282 378 C226 326 158 310 97 331 C57 345 31 374 31 407 C32 438 58 466 99 481 C169 506 242 490 302 452 C392 394 492 405 580 472 C706 568 870 569 1010 518 C1066 498 1105 516 1114 553 C1123 587 1094 620 1044 604 Z" fill="transparent"/>
  </g>
</svg>
